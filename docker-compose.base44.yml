# Base44 sandbox environment for this repository.
#
# The app is a single self-contained static HTML file (sandboxels.html, the
# "Sandboxels" falling-sand game) with no build step, no backend and no
# database. It is therefore served straight from this checkout by a stock
# nginx image, so edits to sandboxels.html are live on the next page reload
# (there is no hot-reload dev server here -- use the preview reload button).
#
# The page's own <base href> points at the jsdelivr CDN for its stylesheet,
# icons and mod/lang files, so those come from the network, not from the repo.
# No credentials are required to boot or play.
services:
  web:
    image: nginx:alpine
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - ./:/site:ro
      # .base44/nginx.conf is the whole nginx config (it sets `user root`, which
      # is needed because the sandbox checkout is mode 0700).
      - ./.base44/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      # Probes real application content, not just an open port.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/ | grep -q 'Sandboxels' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
