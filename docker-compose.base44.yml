# Base44 sandbox environment for this repository.
#
# The app is a single static HTML file (sandboxels.html) served by nginx.
# There is no build step: nginx serves the bind-mounted working tree directly,
# so edits to the HTML show up on the next page load.
#
#   docker compose -f docker-compose.base44.yml up -d
#
services:
  web:
    image: nginx:alpine
    restart: on-failure
    ports:
      # User-facing entry point (the preview proxy serves host port 3000).
      - "3000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      # Full main config: the server must run as root to read the 0700 checkout.
      - ./.base44/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      # Confirms nginx is actually serving the game page, not just listening.
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ | grep -qi '<title' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
