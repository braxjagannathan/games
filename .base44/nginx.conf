# Full nginx main config for the sandbox dev server (mounted at
# /etc/nginx/nginx.conf).
#
# The repository root is mounted read-only at /usr/share/nginx/html. The sandbox
# checkout directory is mode 0700 owned by root, so nginx workers must run as
# root to read the mounted tree; that is the only reason for the `user` line.
# Dot paths are denied so .git and .base44 are never served over the public host.
user root;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index sandboxels.html;

        location ~ /\. {
            deny all;
        }
    }
}
