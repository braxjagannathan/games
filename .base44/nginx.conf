# Complete nginx configuration for the Base44 sandbox preview of this repo.
#
# The app is one self-contained static HTML file (sandboxels.html), so nginx
# just serves the checkout as a static site on port 3000. The repo root has no
# index.html counterpart to the game, so "/" and unknown paths resolve to it.
#
# user root: the sandbox checkout is mode 0700, so the default "nginx" worker
# user cannot traverse the read-only mount inside the container.
user root;
worker_processes auto;
error_log /dev/stderr;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 3000;
        server_name _;

        root /site;
        index sandboxels.html;

        location / {
            try_files $uri $uri/ /sandboxels.html;
        }
    }
}
